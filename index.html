<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Raiha 💖</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  overflow:hidden;
}

/* 💖 background:url(raiha.jpg)
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:url("YOUR_IMAGE.jpg");  /* 👈 এখানে তোমার ছবি দিবে */
  background-size:cover;
  background-position:center;
  filter: brightness(0.6);
  animation: zoom 20s infinite alternate;
}

@keyframes zoom{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}

.container{
  position:absolute;
  width:100%;
  text-align:center;
  top:25%;
  color:white;
}

h1{
  font-size:55px;
  text-shadow:0 0 20px pink;
}

h2{
  font-size:30px;
}

button{
  margin-top:30px;
  padding:12px 25px;
  border:none;
  font-size:18px;
  border-radius:30px;
  cursor:pointer;
  background:hotpink;
  color:white;
}

/* popup */
.popup{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  text-align:center;
  padding-top:15%;
  color:white;
}

.close{
  margin-top:30px;
  display:inline-block;
  padding:10px 20px;
  background:red;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <h1>HAPPY BIRTHDAY RAIHA 💖</h1>
  <h2>✨ 17th Birthday Wishes ✨</h2>

  <button onclick="openPopup()">CLICK ME 💌</button>
</div>

<div class="popup" id="popup">
  <h2>
    You are my happiness, my peace, my everything 💖<br><br>
    Happy 17th Birthday 🎂✨<br><br>
    I will always stay with you ❤️
  </h2>

  <div class="close" onclick="closePopup()">CLOSE</div>
</div>

<script>
function openPopup(){
  document.getElementById("popup").style.display="block";
}
function closePopup(){
  document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
